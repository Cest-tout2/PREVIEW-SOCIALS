<!DOCTYPE html>
<html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Links maken</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:560px;margin:30px auto;padding:0 16px;color:#262626}
label{display:block;margin-top:14px;font-size:13px;font-weight:600}input{width:100%;padding:9px;border:1px solid #ccc;border-radius:6px;font-size:14px}
button{margin-top:16px;padding:10px 16px;border:0;border-radius:6px;background:#111;color:#fff;font-size:14px;cursor:pointer}
.out{margin-top:20px;font-size:13px;word-break:break-all}.out div{margin-bottom:14px;padding:10px;background:#f6f6f6;border-radius:6px}</style></head>
<body><h2>Preview-links maken</h2>
<p style="font-size:13px;color:#666">Vul het beheerderswachtwoord in (SWAP_SECRET uit Vercel). Dit wachtwoord deel je niet met klanten.</p>
<label>Beheerderswachtwoord</label><input id="s" type="password" autocomplete="off">
<label>Naam klant</label><input id="n" placeholder="Eye-C">
<label>Database-ID van de contentkalender</label><input id="d" placeholder="1d0e7a32289e81dbae4ff177da324820">
<button id="b">Maak links</button>
<div class="out" id="o"></div>
<script>
document.getElementById("b").onclick=async()=>{
 const o=document.getElementById("o");o.textContent="Bezig...";
 const db=document.getElementById("d").value.replace(/[^0-9a-f]/gi,"").slice(0,32),name=document.getElementById("n").value.trim();
 const r=await fetch("/api/key",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({secret:document.getElementById("s").value,db})});
 const j=await r.json();if(!r.ok){o.textContent=j.error||"Fout";return;}
 const base=location.origin+"/?db="+db+"&name="+encodeURIComponent(name);
 o.innerHTML="<div><b>Alleen kijken</b> (voor de klant)<br>"+base+"&vk="+j.view+"</div><div><b>Kijken en slepen</b> (voor het team)<br>"+base+"&key="+j.key+"</div>";
};
</script></body></html>
